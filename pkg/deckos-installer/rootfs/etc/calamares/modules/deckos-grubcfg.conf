---
overwrite: false
prefer_grub_d: false
keep_distributor: false
# The Samsung blackout fix flag is added by the post-install step from the choice made in
# the installer (it rewrites GRUB_CMDLINE_LINUX_DEFAULT before the menu is generated).
kernel_params:
    - "quiet"
    - "splash"
    - "loglevel=3"
    - "nowatchdog"
    - "zswap.enabled=0"
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: 0
    GRUB_DISABLE_SUBMENU: false
    GRUB_DISABLE_OS_PROBER: false
    GRUB_DISABLE_RECOVERY: true
    GRUB_TERMINAL_OUTPUT: gfxterm
    GRUB_GFXMODE: "1920x1080,auto"
    GRUB_GFXPAYLOAD_LINUX: keep
    GRUB_THEME: "/usr/share/grub/themes/deckos/theme.txt"
always_use_defaults: true
