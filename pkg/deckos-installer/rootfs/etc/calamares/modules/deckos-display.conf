---
# Samsung Odyssey G7 blackout fix level. Read by the post-install step as
# ${gs[packagechooser_deckosdisplay]}. Changeable later in DeckOS Hub › Display.
mode: required
method: legacy
labels:
    step: "Display fix"
default: "1"
items:
    - id: "1"
      name: "Level 1 — Recommended"
      description: "Turns off the RX 9070 XT's firmware-assisted memory-clock switching, the usual cause of 1–2 second black flashes on high-refresh 4K monitors. Almost no cost."
      screenshot: "/usr/share/deckos/branding/choice-display.png"
    - id: "2"
      name: "Level 2 — Pinned VRAM clock"
      description: "Level 1, plus the video memory clock is locked at full speed. Use this if level 1 still blinks. About 15–30 W more at idle."
      screenshot: "/usr/share/deckos/branding/choice-display.png"
    - id: "3"
      name: "Level 3 — No power-state switching"
      description: "Level 2, plus no multi-monitor clock switching, Panel Self Refresh or Panel Replay."
      screenshot: "/usr/share/deckos/branding/choice-display.png"
    - id: "4"
      name: "Level 4 — Everything locked high"
      description: "Every GPU clock forced high. Last resort: most idle power and heat."
      screenshot: "/usr/share/deckos/branding/choice-display.png"
    - id: "0"
      name: "Off — AMD defaults"
      description: "No workarounds. Pick this if your monitor doesn't flicker."
      screenshot: "/usr/share/deckos/branding/choice-display.png"
