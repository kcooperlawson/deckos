---
showSupportUrl:      false
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
showDonateUrl:       false

requirements:
    # DeckOS itself needs ~15 GB; the rest is room for games, models and snapshots.
    requiredStorage:  40
    requiredRam:      4.0
    internetCheckUrl:
        - https://geo.mirror.pkgbuild.com
        - https://mirror.cachyos.org
        - https://archlinux.org
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    # Internet is recommended (software choices, Zen 4 packages), not required:
    # without it DeckOS installs from the USB alone.
    required:
        - storage
        - ram
        - root
