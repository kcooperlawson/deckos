---
# Installs what was ticked on the Software page. The repos (Arch, CachyOS Zen 4, and the
# DeckOS repo on the USB) were prepared by shellprocess@prep just before. Offline, this step
# is skipped and DeckOS is installed exactly as the USB has it.
backend: pacman
skip_if_no_internet: true
update_db: true
update_system: false
pacman:
    num_retries: 3
    disable_download_timeout: true
    needed_only: true
