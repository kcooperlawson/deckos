---
# Units from software that wasn't ticked are simply skipped (mandatory: false).
units:
  - { name: NetworkManager,        action: enable,  mandatory: false }
  - { name: bluetooth,             action: enable,  mandatory: false }
  - { name: power-profiles-daemon, action: enable,  mandatory: false }
  - { name: systemd-timesyncd,     action: enable,  mandatory: false }
  - { name: fstrim.timer,          action: enable,  mandatory: false }
  - { name: grub-btrfsd,           action: enable,  mandatory: false }
  - { name: snapper-cleanup.timer, action: enable,  mandatory: false }
  - { name: deckos-display,        action: enable,  mandatory: false }
  - { name: ananicy-cpp,           action: enable,  mandatory: false }
  - { name: lactd,                 action: enable,  mandatory: false }
  - { name: docker.socket,         action: enable,  mandatory: false }
  - { name: ollama,                action: enable,  mandatory: false }
  - { name: pacman-init,           action: disable, mandatory: false }
  - { name: choose-mirror,         action: disable, mandatory: false }
  - { name: livecd-alsa-unmuter,   action: disable, mandatory: false }
  - { name: sshd,                  action: disable, mandatory: false }
