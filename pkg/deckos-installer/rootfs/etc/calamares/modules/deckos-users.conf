---
defaultGroups:
    - wheel
    - video
    - audio
    - input
    - lp
    - network
    - storage
    - rfkill
    - sys
    - name: users
      must_exist: true
      system: true
    - name: render
      must_exist: false
      system: true
    # Created now so the Gaming and Development choices work on first login.
    - name: gamemode
      must_exist: false
      system: true
    - name: docker
      must_exist: false
      system: true

doAutologin:      false
sudoersGroup:     wheel
setRootPassword:  false
doReusePassword:  false

passwordRequirements:
    minLength: 4
allowWeakPasswords:        false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root, liveuser, adm, bin, daemon, dbus, ftp, games, http, mail, nobody, polkitd, rtkit, sys, uuidd ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "deckos"
