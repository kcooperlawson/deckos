---
# GRUB layout: EFI partition at /boot/efi (Windows' existing one is reused when installing
# alongside it), kernels stay on btrfs so snapshots can boot older kernels too.
efiSystemPartition:        "/boot/efi"
efiSystemPartitionSize:    512M
efiSystemPartitionName:    "EFI"

userSwapChoices:
    - none            # DeckOS uses zram (compressed RAM swap) instead
initialSwapChoice:   none

drawNestedPartitions:      false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
defaultPartitionTableType: gpt
defaultFileSystemType:     "btrfs"
availableFileSystemTypes:  [ "btrfs", "ext4" ]
luksGeneration:            luks2
enableLuksAutomatedPartitioning: true
