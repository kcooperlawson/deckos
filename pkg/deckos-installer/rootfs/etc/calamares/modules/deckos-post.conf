---
# Applies the DeckOS choices (start-up mode, display fix), Zen 4 updates, drives, snapshots.
dontChroot: false
timeout: 3600
i18n:
    name: "Tuning DeckOS for your PC"
script:
    - command: "/usr/lib/deckos/installer/post ${USER} ${gs[packagechooser_deckosboot]} ${gs[packagechooser_deckosdisplay]}"
      timeout: 3600
