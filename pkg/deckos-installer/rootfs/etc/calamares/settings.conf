# DeckOS installer flow (Calamares). Every module DeckOS configures runs as a "deckos" instance
# with its own deckos-*.conf, so nothing here collides with the files cachyos-calamares ships.
---
modules-search: [ local ]

instances:
- { id: deckos,        module: welcome,          config: deckos-welcome.conf }
- { id: deckos,        module: locale,           config: deckos-locale.conf }
- { id: deckos,        module: keyboard,         config: deckos-keyboard.conf }
- { id: deckos,        module: partition,        config: deckos-partition.conf }
- { id: software,      module: netinstall,       config: deckos-netinstall.conf }
- { id: deckosboot,    module: packagechooser,   config: deckos-boot.conf }
- { id: deckosdisplay, module: packagechooser,   config: deckos-display.conf }
- { id: deckos,        module: users,            config: deckos-users.conf }
- { id: deckos,        module: mount,            config: deckos-mount.conf }
- { id: deckos,        module: unpackfs,         config: deckos-unpackfs.conf }
- { id: deckos,        module: fstab,            config: deckos-fstab.conf }
- { id: deckos,        module: removeuser,       config: deckos-removeuser.conf }
- { id: deckos,        module: displaymanager,   config: deckos-displaymanager.conf }
- { id: deckos,        module: initcpiocfg,      config: deckos-initcpiocfg.conf }
- { id: prep,          module: shellprocess,     config: deckos-prep.conf }
- { id: deckos,        module: packages,         config: deckos-packages.conf }
- { id: deckos,        module: grubcfg,          config: deckos-grubcfg.conf }
- { id: post,          module: shellprocess,     config: deckos-post.conf }
- { id: deckos,        module: bootloader,       config: deckos-bootloader.conf }
- { id: deckos,        module: services-systemd, config: deckos-services.conf }
- { id: deckos,        module: finished,         config: deckos-finished.conf }

sequence:
- show:
  - welcome@deckos
  - locale@deckos
  - keyboard@deckos
  - partition@deckos
  - netinstall@software
  - packagechooser@deckosboot
  - packagechooser@deckosdisplay
  - users@deckos
  - summary
- exec:
  - partition@deckos
  - mount@deckos
  - unpackfs@deckos
  - machineid
  - fstab@deckos
  - locale@deckos
  - keyboard@deckos
  - localecfg
  - shellprocess@prep
  - removeuser@deckos
  - users@deckos
  - displaymanager@deckos
  - networkcfg
  - hwclock
  - initcpiocfg@deckos
  - initcpio
  - packages@deckos
  - grubcfg@deckos
  - shellprocess@post
  - bootloader@deckos
  - services-systemd@deckos
  - umount
- show:
  - finished@deckos

branding: deckos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
