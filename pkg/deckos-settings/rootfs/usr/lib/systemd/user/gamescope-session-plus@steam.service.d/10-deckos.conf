[Unit]
# SDDM can log back in before the previous Plasma user services have finished exiting.
Conflicts=plasma-workspace.target
After=plasma-workspace.target

[Service]
ExecStart=
ExecStart=/usr/lib/deckos/gaming-service
# Steam and helpers must not survive a failed session or keep the GPU/display busy.
ExecStopPost=/usr/lib/deckos/gaming-cleanup
KillMode=control-group
TimeoutStopSec=10s
