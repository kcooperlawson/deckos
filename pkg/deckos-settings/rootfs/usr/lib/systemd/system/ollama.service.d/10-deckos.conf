# DecKoOS: keep graphics memory free for the desktop. A model that would fill the card puts its
# remaining layers in system RAM instead, so KWin isn't starved (stalls and evicted queues otherwise).
# The llama.cpp engine reads LLAMA_ARG_FIT_TARGET (MiB left free, default 1024); Ollama's own engine
# reads OLLAMA_GPU_OVERHEAD (bytes).
[Service]
Environment="LLAMA_ARG_FIT_TARGET=2048"
Environment="OLLAMA_GPU_OVERHEAD=2147483648"
