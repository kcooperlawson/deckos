# DecKoOS release notes: What's New reads these (deckos-whatsnew), once per feature release.

version = "0.22.0"
name = "Sing along"
tagline = "Live lyrics in Vibe mode, a Desktop shelf in place of icons, and fewer, clearer apps in the DecKo look."

fixes = [
    "Vibe mode follows Spotify's position to the moment, not the half second.",
    "The clock no longer runs past the edge of the tray's box on the taskbar.",
    "KDE's own Welcome Center no longer opens after Plasma updates: DecKoOS Welcome and What's New cover it.",
]

[[highlights]]
title = "The Desktop shelf"
text = """Desktop icons are now live tiles on one card, in your Vibe's colours: a Steam game shows its art, when you \
last played and a Play button; a folder shows how much is in it and a peek at its pictures; a picture is the tile; \
a text file shows its first lines; a download still arriving shows how much has come. Drop things on it to keep them \
on the Desktop. It's still your Desktop folder, so nothing moves. Turn it off under Appearance › Desktop widgets to \
get the icons back."""
icon = "folder"

[[highlights]]
title = "Health, in one place"
text = """DecKoOS Hub has a Health page: the checkup that was System Doctor, games that closed right after starting \
(each opens Game Doctor), DecKoOS's fixes and their switches, and a report to send whoever helps you."""
icon = "check"
try = "Open Health"
run = ["deckos-hub", "--page", "health"]

[[highlights]]
title = "Fewer, clearer apps"
text = """DecKoOS's apps take on the desktop's look: notched cards and buttons, Chakra Petch labels, LED meters. And \
the menu is down to one entry per job. DecKoOS Work is now DecKoOS Assistant's workspace (right click the Assistant), \
Tour, Move in and What's New live in Welcome, and Builder moved to the Hub's AI & Dev page."""
icon = "grid"

[[highlights]]
title = "Live lyrics"
image = "0.22.0/lyrics-and-grid.png"
text = """Vibe mode shows the words as they're sung: the line you're on fills with colour as it goes and pulses with \
the beat, the next one waiting below. With two or more monitors the lyrics get a screen of their own, beside the \
cover; on one, they run under it. They come from LRCLIB, a free lyrics library (it's sent the song's title and \
artist), or from an .lrc file next to your own music. Lyrics can be turned off in Vibe mode, or with Y."""
icon = "music"
try = "Start Vibe mode"
run = ["deckos-music"]

[[highlights]]
title = "Three new looks"
image = "0.22.0/kaleido.png"
text = """Grid races a neon floor toward a striped sun behind the cover, with mountains made of the music. Scope draws \
the song as one glowing line through every screen. Kaleido turns a kaleidoscope round the cover that opens with the \
bass. Pick one with the palette button, or press V to flip through all seven."""
icon = "appearance"
try = "Start Vibe mode"
run = ["deckos-music"]

[[highlights]]
title = "As your desk is"
text = """Vibe mode lays your screens out as they really are: a smaller monitor shows the stage smaller, and the space \
between them is there too. Set it under "Space between screens" in Vibe mode's look picker."""
icon = "display"
