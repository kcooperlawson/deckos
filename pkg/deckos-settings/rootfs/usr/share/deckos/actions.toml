# DecKoOS actions: everything DecKoOS can do, once. DecKoOS Menu's search, `deckos do ID`, and DecKoOS
# Assistant all read this list (usr/lib/deckos/actions/actions.py).
#   title     what it does, as a button would say it
#   summary   one line more
#   keywords  other words people type for it
#   icon      a DecKoOS line icon
#   run       the command (argv)
#   how       "app" (starts something: the default) or "terminal" (shows its output in DecKoOS Terminal)

[[action]]
id = "gaming-mode"
title = "Switch to Gaming Mode"
summary = "Steam full screen, like a Steam Deck"
keywords = "big picture steam deck tv couch controller"
icon = "gaming"
run = ["deckos", "session", "gaming", "--ask"]

[[action]]
id = "checkup"
title = "Run a checkup"
summary = "System Doctor: what's wrong, in plain words, with fixes"
keywords = "health problem broken crash slow error fix doctor diagnose"
icon = "check"
run = ["deckos-sysdoctor"]

[[action]]
id = "kid-mode"
title = "Start Kid mode"
summary = "Locks your session; a child picks their picture on the login screen"
keywords = "kids child children parental controls family son daughter safe"
icon = "user"
run = ["deckos", "kids", "start"]

[[action]]
id = "report"
title = "Make a report for whoever helps"
summary = "One file with this PC's hardware, drivers and recent errors; personal details taken out"
keywords = "bug report help support hardware log diagnostics send nvidia intel"
icon = "check"
run = ["deckos", "report"]
how = "terminal"

[[action]]
id = "update"
title = "Update DecKoOS"
summary = "Updates DecKoOS and every app"
keywords = "upgrade updates pacman new version"
icon = "update"
run = ["deckos", "update"]
how = "terminal"

[[action]]
id = "timeline"
title = "See what changed"
summary = "The timeline: updates, fixes and changes, with Undo"
keywords = "history undo recent changes log what happened rollback revert"
icon = "clock"
run = ["deckos-hub", "--page", "timeline"]

[[action]]
id = "drives-relink"
title = "Link my Windows drives"
summary = "Mounts your NTFS drives and keeps them after a restart"
keywords = "ntfs drive disk mount windows hdd ssd games library missing"
icon = "drives"
run = ["sudo", "deckos", "drives", "rescan"]
how = "terminal"

[[action]]
id = "drives-doctor"
title = "Why is my drive read-only?"
summary = "Checks for Windows Fast Startup and dirty NTFS drives"
keywords = "read only readonly ntfs fast startup hibernate dirty drive"
icon = "drives"
run = ["deckos", "drives", "doctor"]
how = "terminal"

[[action]]
id = "game-doctor"
title = "Fix a game that won't start"
summary = "Game Doctor looks at why the last game closed"
keywords = "game crash wont start launch proton fix doctor steam"
icon = "gaming"
run = ["deckos-gamedoctor"]

[[action]]
id = "retro"
title = "Play retro games"
summary = "DecKoOS Retro: your games, set up and in Steam"
keywords = "emulator emulation retroarch rom nes snes n64 playstation ps1 ps2 gamecube nintendo sega"
icon = "gaming"
run = ["deckos-retro"]

[[action]]
id = "sysmon"
title = "See what's running"
