# DecKoOS login screen: Wayland greeter on KWin (no X server needed), with the DecKoOS theme
# (/usr/share/sddm/themes/deckos). Breeze still has the DecKoOS background if you switch back.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell
# First login (nothing remembered yet): Plasma, never Gaming Mode.
DefaultSession=plasma.desktop

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=deckos
CursorTheme=DeckOS-cursors
Font=Inter,10
