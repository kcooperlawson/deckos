# DeckOS login screen: Wayland greeter on KWin (no X server needed), Breeze theme with the
# DeckOS background (see /usr/share/sddm/themes/breeze/theme.conf.user).
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=breeze
CursorTheme=breeze_cursors
Font=Inter,10
