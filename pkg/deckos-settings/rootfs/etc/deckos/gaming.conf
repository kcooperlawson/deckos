# DecKoOS Gaming Mode settings (gamescope-session-plus variables).
# Per-user overrides go in ~/.config/deckos/gaming.conf (DecKoOS Hub writes that one).

# Output to use. Empty = auto-pick the Samsung Odyssey (deckos gaming detect).
OUTPUT_CONNECTOR=

# Samsung Odyssey G70B: 3840x2160 @ 144 Hz.
SCREEN_WIDTH=3840
SCREEN_HEIGHT=2160
CUSTOM_REFRESH_RATES=60,120,144

# VRR is off by default: the G7 is known to flicker with Adaptive-Sync on. Try it once the
# display fix is confirmed working (DecKoOS Hub > Gaming > Variable refresh rate).
ADAPTIVE_SYNC=0

# HDR (the G70B is DisplayHDR 400; enable it in the monitor menu too).
ENABLE_GAMESCOPE_HDR=0
