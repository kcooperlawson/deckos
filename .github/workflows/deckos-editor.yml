name: DeckOS Editor

# Builds DeckOS Editor in an Arch container and screenshots it offscreen (--demo --screenshot), so
# the app can be checked from any OS. The screenshots are the deckos-editor-screenshots artifact.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["apps/deckos-editor/**", "apps/deckos-files/src/style.*", "pkg/deckos-editor/**", ".github/workflows/deckos-editor.yml"]
  pull_request:
    paths: ["apps/deckos-editor/**", "apps/deckos-files/src/style.*", "pkg/deckos-editor/**", ".github/workflows/deckos-editor.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          ( startdir=$PWD/pkg/deckos-editor; . pkg/deckos-editor/PKGBUILD; pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}" )
          useradd -m builder
          mkdir /home/builder/src && cp -r apps pkg VERSION /home/builder/src/ && chown -R builder: /home/builder/src
          su builder -c "cd ~/src/pkg/deckos-editor && MAKEFLAGS='-k -j4' makepkg --nodeps --noconfirm"
          pacman -U --noconfirm /home/builder/src/pkg/deckos-editor/*.pkg.tar.zst
          pacman -Qlp /home/builder/src/pkg/deckos-editor/*.pkg.tar.zst
      - name: Screenshots (offscreen)
        run: |
          pacman -S --noconfirm --needed papirus-icon-theme breeze breeze-icons inter-font dbus
          cp -r pkg/deckos-settings/rootfs/usr/share/deckos /usr/share/
          export QT_QPA_PLATFORM=offscreen XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p -m 700 /tmp/xdg
          timeout 240 dbus-run-session -- deckos-editor --demo --screenshot "$PWD/screenshots" 2>&1 | tee screenshots.log
          ls -l screenshots
          test "$(ls screenshots/*.png | wc -l)" -ge 2
      - name: Files, find and editing (offscreen)
        run: |
          su builder -c "cmake -S ~/src/apps/deckos-editor -B ~/keys -DDECKOS_EDITOR_TESTS=ON && cmake --build ~/keys -j4 --target editor_test"
          su builder -c "mkdir -p -m 700 /tmp/xdg-builder && cd ~ && XDG_RUNTIME_DIR=/tmp/xdg-builder QT_QPA_PLATFORM=offscreen timeout 120 dbus-run-session -- ~/keys/editor_test"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deckos-editor-screenshots
          path: |
            screenshots/*.png
            screenshots.log
      - uses: actions/upload-artifact@v4
        with:
          name: deckos-editor-package
          path: /home/builder/src/pkg/deckos-editor/*.pkg.tar.zst
