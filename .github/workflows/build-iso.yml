name: Build DeckOS ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -s bash build.sh installer/deckos-install \
            pkg/deckos-settings/rootfs/usr/bin/deckos \
            pkg/deckos-settings/rootfs/usr/lib/deckos/session-switch \
            pkg/deckos-settings/rootfs/usr/lib/deckos/gaming-session \
            pkg/deckos-settings/rootfs/usr/lib/os-session-select \
            pkg/deckos-installer/rootfs/usr/bin/deckos-installer \
            pkg/deckos-installer/rootfs/usr/lib/deckos/installer/prep \
            pkg/deckos-installer/rootfs/usr/lib/deckos/installer/post
          shellcheck -S warning -s sh pkg/deckos-settings/rootfs/usr/lib/deckos/brand-os-release \
            pkg/deckos-settings/rootfs/etc/profile.d/deckos.sh
      - name: python
        run: python3 -m py_compile pkg/deckos-settings/rootfs/usr/lib/deckos/hub/deckos_hub.py builder/deckos_builder.py
      - name: yaml
        run: |
          python3 - <<'PY'
          import glob, yaml
          files = glob.glob("pkg/deckos-installer/rootfs/etc/calamares/**/*.conf", recursive=True) + \
                  glob.glob("pkg/deckos-installer/rootfs/etc/calamares/**/*.yaml", recursive=True) + \
                  ["pkg/deckos-installer/rootfs/usr/share/calamares/branding/deckos/branding.desc"]
          for f in files:
              yaml.safe_load(open(f))
          print(f"{len(files)} Calamares YAML files parse")
          PY

  package:
    # Proves both DeckOS packages (theme, fonts, splash, tools, installer) build on Arch.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git librsvg grub
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          useradd -m builder
          cp -r pkg /home/builder/pkg && chown -R builder: /home/builder/pkg
          for p in deckos-settings deckos-installer; do
            su builder -c "cd ~/pkg/$p && makepkg --nodeps --noconfirm"
          done
          pacman -Qlp /home/builder/pkg/deckos-settings/*.pkg.tar.zst | grep -cE '\.(png|pf2)$'
      - uses: actions/upload-artifact@v4
        with:
          name: deckos-packages
          path: /home/builder/pkg/*/*.pkg.tar.zst

  iso:
    needs: [lint, package]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the live desktop ISO needs ~25 GB while building)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          sudo mkdir -p /mnt/deckos && sudo chmod 777 /mnt/deckos
          df -h / /mnt
      - name: Build (Arch container)
        run: |
          sudo docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" -v /mnt/deckos:/work \
            -e WORK=/work/build -e OUT=/src/out \
            archlinux:latest bash -c 'pacman -Syu --noconfirm --needed sudo && bash /src/build.sh'
          sudo chown -R "$(id -u):$(id -g)" out
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: deckos-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 14
