name: Build DeckOS ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -s bash build.sh installer/deckos-install tests/install-test.sh .github/publish-repo \
            iso/airootfs/usr/local/bin/deckos-autoinstall \
            pkg/deckos-settings/rootfs/usr/bin/deckos \
            pkg/deckos-settings/rootfs/usr/lib/deckos/session-switch \
            pkg/deckos-settings/rootfs/usr/lib/deckos/gaming-session \
            pkg/deckos-settings/rootfs/usr/lib/deckos/gaming-service \
            pkg/deckos-settings/rootfs/usr/lib/deckos/gaming-cleanup \
            pkg/deckos-settings/rootfs/usr/lib/os-session-select \
            pkg/deckos-installer/rootfs/usr/bin/deckos-installer \
            pkg/deckos-settings/rootfs/usr/share/deckos/shell/snapshot-first.bash tests/vm/partition_harness.bash
          shellcheck -S warning -s sh pkg/deckos-settings/rootfs/usr/lib/deckos/brand-os-release \
            pkg/deckos-settings/rootfs/etc/profile.d/deckos.sh
      - name: python
        run: |
          python3 -m py_compile pkg/deckos-settings/rootfs/usr/lib/deckos/*/*.py builder/deckos_builder.py \
            pkg/deckos-installer/rootfs/usr/lib/deckos/installer/deckos_installer.py assets/*.py

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ripgrep
      - run: python -m pip install PySide6-Essentials
      - name: Engine and offscreen UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p 'test_*.py'

  package:
    # Proves the DeckOS packages (theme, icons, fonts, splash, Hub, tools, installer) build on Arch.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git librsvg grub papirus-icon-theme
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          for p in deckos-files deckos-terminal; do
            ( startdir=$PWD/pkg/$p; . pkg/$p/PKGBUILD; pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}" )
          done
          useradd -m builder
          mkdir /home/builder/src && cp -r apps pkg VERSION /home/builder/src/ && chown -R builder: /home/builder/src
          for p in deckos-files deckos-terminal deckos-settings deckos-theme-tmpikes deckos-installer; do
            su builder -c "cd ~/src/pkg/$p && makepkg --nodeps --noconfirm"
          done
          files=$(pacman -Qlp /home/builder/src/pkg/deckos-settings/*.pkg.tar.zst)
          echo "$files" | grep -cE '\.(png|pf2)$'
          echo "DeckOS folder icons: $(echo "$files" | grep -c 'usr/share/icons/DeckOS/.*\.svg$')"
          echo "$files" | grep -q 'usr/share/icons/DeckOS/index.theme'
          echo "$files" | grep -q 'usr/share/sddm/themes/deckos/Main.qml'
      - uses: actions/upload-artifact@v4
        with:
          name: deckos-packages
          path: /home/builder/src/pkg/*/*.pkg.tar.zst

  plan:
    # Whether this run builds an ISO. Installed systems get a release through the update repo, so a
    # tag only builds one when the installer or the live USB changed since the last ISO this workflow
    # actually built (not the last tag: a tag whose run was cancelled or failed built none), or when
    # the tag or commit message says [iso]. Build ISO in DeckOS Builder (workflow_dispatch) always does.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      iso: ${{ steps.check.outputs.iso }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live="build.sh installer iso pkg/deckos-installer pkg/deckos-settings/rootfs/usr/share/deckos/packages .github/workflows/build-iso.yml"
          iso=true why="not a version tag"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            msg="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME") $(git log -1 --format=%B)"
            # The commit of the newest earlier run whose iso job succeeded.
            prev=""
            for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-iso.yml/runs?status=success&per_page=30" \
                           --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | \"\(.id):\(.head_sha)\""); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run%%:*}/jobs" \
                   --jq '.jobs[] | select(.name == "iso") | .conclusion' | grep -qx success \
                 && git cat-file -e "${run#*:}^{commit}" 2>/dev/null; then prev=${run#*:}; break; fi
            done
            if [ -z "$prev" ]; then why="no earlier ISO build found"
            elif case "$msg" in *"[iso]"*) true ;; *) false ;; esac; then why="asked for with [iso]"
            elif changed=$(git diff --name-only "$prev" HEAD -- $live) && [ -n "$changed" ]; then
              why="installer or live USB changed since the last ISO (${prev:0:7}): $(echo "$changed" | head -5 | tr '\n' ' ')"
            else iso=false why="nothing for the installer or live USB changed since the last ISO (${prev:0:7})"; fi
          fi
          echo "ISO: $iso ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "iso=$iso" >> "$GITHUB_OUTPUT"

  iso:
    needs: [lint, package, plan]
    if: github.event_name != 'pull_request' && needs.plan.outputs.iso == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The package job's builds, so build.sh doesn't make them again.
      - uses: actions/download-artifact@v4
        with:
          name: deckos-packages
          path: prebuilt
      - name: Build (Arch container)
        run: |
          # The runner has ~110 GB free and the build needs ~25 GB: no clean-up needed first.
          sudo mkdir -p /mnt/deckos && sudo chmod 777 /mnt/deckos
          sudo docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" -v /mnt/deckos:/work \
            -e WORK=/work/build -e OUT=/src/out -e PREBUILT=/src/prebuilt \
            archlinux:latest bash -c 'pacman -Syu --noconfirm --needed sudo && bash /src/build.sh'
          sudo chown -R "$(id -u):$(id -g)" out
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: deckos-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 14

  install-test:
    # Installs the new ISO onto a blank virtual disk in QEMU (OVMF, KVM), boots the installed system
    # and waits for its login screen. Fails with both serial consoles in the log and as an artifact.
    # Two disks: a partition next to an EFI partition (the usual Windows PC), and an empty disk
    # DeckOS gets whole (its own EFI partition).
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        layout: [partition, empty]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deckos-iso
          path: out
      - name: QEMU + OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf libarchive-tools dosfstools fdisk jq
          # GitHub's runners have KVM; let the runner user open it.
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || true
      - name: Install and first boot
        run: bash tests/install-test.sh out/*.iso install-test
        env:
          DECKOS_TEST_LAYOUT: ${{ matrix.layout }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test-logs-${{ matrix.layout }}
          path: install-test/*.log
          retention-days: 14

  publish:
    # The DeckOS testing channel: on a version tag (v0.3.1), sign deckos-settings, deckos-files, deckos-terminal and the
    # themes and publish them as a pacman repo in the "repo-testing" release. PCs on the testing channel
    # (deckos channel testing) pull from https://github.com/<owner>/<repo>/releases/download/repo-testing within minutes,
    # so failing unit tests stop the release. Stable ("repo") only changes through the "Promote to stable" workflow.
    needs: [lint, unit-tests, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency: deckos-repo  # never upload while Promote to stable is copying, or the other way round
    container: archlinux:latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEY: F67E15FABF95D2DA72BE5D3F6322881773088C41
    steps:
      - run: pacman -Syu --noconfirm --needed github-cli gnupg git
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deckos-packages
          path: built
      - name: Tag matches VERSION
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)" ] \
            || { echo "tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)"; exit 1; }
      - name: Sign and build the repo
        env:
          SIGNING_KEY: ${{ secrets.DECKOS_SIGNING_KEY }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          mkdir repo
          # deckos-installer only belongs on the live USB, so it isn't published.
          find built -name '*.pkg.tar.zst' ! -name 'deckos-installer-*' -exec cp {} repo/ \;
          cd repo
          for p in *.pkg.tar.zst; do gpg --batch --yes --local-user "$KEY" --detach-sign "$p"; done
          repo-add --sign --key "$KEY" deckos.db.tar.gz *.pkg.tar.zst
          # Release assets can't be symlinks: give pacman real deckos.db / deckos.files.
          for f in deckos.db deckos.files deckos.db.sig deckos.files.sig; do cp --remove-destination "$(readlink -f "$f")" "$f"; done
          ls -l
      - name: Publish to the "repo-testing" release
        run: bash .github/publish-repo repo-testing repo
