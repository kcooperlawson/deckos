name: DeckOS Terminal

# Builds DeckOS Terminal in an Arch container and screenshots it offscreen (--demo --screenshot), so
# the app can be checked from any OS. The screenshots are the deckos-terminal-screenshots artifact.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["apps/deckos-terminal/**", "apps/deckos-files/src/style.*", "pkg/deckos-terminal/**", ".github/workflows/deckos-terminal.yml"]
  pull_request:
    paths: ["apps/deckos-terminal/**", "apps/deckos-files/src/style.*", "pkg/deckos-terminal/**", ".github/workflows/deckos-terminal.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          ( startdir=$PWD/pkg/deckos-terminal; . pkg/deckos-terminal/PKGBUILD; pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}" )
          useradd -m builder
          mkdir /home/builder/src && cp -r apps pkg VERSION /home/builder/src/ && chown -R builder: /home/builder/src
          su builder -c "cd ~/src/pkg/deckos-terminal && MAKEFLAGS='-k -j4' makepkg --nodeps --noconfirm"
          pacman -U --noconfirm /home/builder/src/pkg/deckos-terminal/*.pkg.tar.zst
          pacman -Qlp /home/builder/src/pkg/deckos-terminal/*.pkg.tar.zst
      - name: Screenshots (offscreen)
        run: |
          pacman -S --noconfirm --needed papirus-icon-theme breeze breeze-icons inter-font dbus
          cp -r pkg/deckos-settings/rootfs/usr/share/deckos /usr/share/
          export QT_QPA_PLATFORM=offscreen XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p -m 700 /tmp/xdg
          timeout 240 dbus-run-session -- deckos-terminal --demo --screenshot "$PWD/screenshots" 2>&1 | tee screenshots.log
          ls -l screenshots
          test "$(ls screenshots/*.png | wc -l)" -ge 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deckos-terminal-screenshots
          path: |
            screenshots/*.png
            screenshots.log
      - uses: actions/upload-artifact@v4
        with:
          name: deckos-terminal-package
          path: /home/builder/src/pkg/deckos-terminal/*.pkg.tar.zst
