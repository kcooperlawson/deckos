#
# DeckOS pacman configuration. The installer adds the CachyOS Zen 4 repos above [core]
# on Zen 4/5 CPUs and drops the [deckos] on-USB repo once installing is done.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
Color
ILoveCandy
VerbosePkgLists
ParallelDownloads = 10
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# CachyOS: the kernel, Proton-CachyOS, the installer and tuned settings.
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# Apps built for DeckOS from the AUR, shipped on the USB (installer only).
[deckos]
SigLevel = Optional TrustAll
Server = file:///opt/deckos/repo
